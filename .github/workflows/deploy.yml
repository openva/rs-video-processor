name: Deploy Process

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
      
      - name : Fetch Richmond Sunlight includes
        run: |
          git clone --depth 1 -b deploy https://github.com/openva/richmondsunlight.com.git
          echo "Using richmondsunlight.com deploy@$(git -C richmondsunlight.com rev-parse HEAD)"
          mkdir includes/
          cp richmondsunlight.com/htdocs/includes/*.php includes/
          rm -Rf richmondsunlight.com

      - name: Build Docker environment
        run: ./docker-run.sh

      - name: Run test suite inside Docker
        run: ./docker-tests.sh

      - name: Stop Docker environment
        run: ./docker-stop.sh
      
      - name: Make sure there are no fatal errors in PHP
        run: find *.php -print0 |xargs -0 -n1 -P8 php -l

      # Everything below runs only for deploys. The bundle contains production
      # secrets, so it goes straight to the private S3 bucket and must never be
      # published as a GitHub Actions artifact (artifacts on a public repo are
      # downloadable by anyone).
      - name: Build deploy bundle
        if: github.event_name != 'pull_request'
        env:
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          PDO_DSN: ${{ secrets.PDO_DSN }}
          PDO_SERVER: ${{ secrets.PDO_SERVER }}
          PDO_USERNAME: ${{ secrets.PDO_USERNAME }}
          PDO_PASSWORD: ${{ secrets.PDO_PASSWORD }}
          MEMCACHED_SERVER: ${{ secrets.MEMCACHED_SERVER }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: |
          ./deploy/config_variables.sh
          mkdir -p upload
          zip -qr upload/latest.zip . -x '*.git*' '*.scannerwork*' 'upload/*'

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      - name: Copy file to S3
        if: github.event_name != 'pull_request'
        run: aws s3 cp upload/latest.zip s3://deploy.richmondsunlight.com/rs-video-processor-master.zip
